worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Логи
    access_log  logs/access.log;
    error_log   logs/error.log;

    # HTTP сервер (перенаправление на HTTPS при необходимости)
    server {
        listen       80;
        server_name  localhost 127.0.0.1 0.0.0.0;

        # Кодировка
        charset utf-8;

        # Максимальный размер загружаемых файлов
        client_max_body_size 20M;

        # Статические файлы (CSS, JS, изображения)
        location /static/ {
            alias   d:/DevS/BrainArena/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Медиа файлы (загруженные пользователями)
        location /media/ {
            alias   d:/DevS/BrainArena/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Прокси на Django приложение
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}