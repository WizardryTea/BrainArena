worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Настройки кодировки для русских имен файлов
    charset utf-8;

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # !!! ПУТЬ к проекту
        set $project_root D:/DevS/BrainArena;

        # Корень для статики и медиа
        root $project_root;

        # Локация для статических файлов (CSS, JS, изображения)
        location /static/ {
            alias $project_root/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Локация для медиа-файлов (аватары пользователей)
        location /media/ {
            alias $project_root/media/;
            expires 7d;
            add_header Cache-Control "public";
            
            # Вкл поддержку русских имен файлов
            try_files $uri =404;
        }

        # Прокси на Django для всех остальных запросов
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Таймауты для долгих игровых запросов
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
        }

        # Локация для админки (тоже через прокси)
        location /admin/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Локация для WebSocket
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Обработка ошибок
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root html;
        }
    }
}